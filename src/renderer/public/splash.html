<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* A janela é transparente e sem moldura (main.ts): o arredondamento
           vem deste contentor, não do body. */
        html, body {
            height: 100%;
            background: transparent;
        }

        .frame {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d121c;
            border-radius: 18px;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
        }

        .logo {
            width: 110px;
            height: 110px;
            margin-bottom: 5px;
        }

        .title {
            color: white;
            font-size: 1.8em;
            font-weight: 900;
            margin-bottom: 4px;
            letter-spacing: 2px;
            font-family: sans-serif;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .description {
            color: rgba(255,255,255,0.9);
            font-size: 0.95em;
            margin-bottom: 4px;
            font-weight: 600;
            letter-spacing: 1px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .version {
            color: rgba(255,255,255,0.7);
            font-size: 0.6em;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }

        /* Só a letra C do logo anima: o arco gira à volta do pin, as ondas pulsam. */
        .c-spin {
            transform-origin: 150px 128px;
            animation: c-spin 2.4s cubic-bezier(.6,.1,.4,.9) infinite;
        }
        .wave { animation: wave 1.6s ease-in-out infinite; }
        .wave.w2 { animation-delay: .25s; }
        .pin { transform-origin: 150px 134px; animation: pin 2.4s ease-in-out infinite; }

        @keyframes c-spin { to { transform: rotate(360deg); } }
        @keyframes wave { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
        @keyframes pin { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        @media (prefers-reduced-motion: reduce) {
            .c-spin, .wave, .pin { animation: none; }
        }

        .company-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 0.55em;
            font-weight: 500;
            color: rgba(255,255,255,0.4);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            letter-spacing: 0.5px;
            line-height: 1.3;
            text-align: left;
            z-index: 10;
        }
    </style>
</head>
<body>
<div class="frame">
    <div class="company-info">
        AKM Systems<br>
        Luanda, Angola 2026<br>
        NIF: 007485779ZE047<br>
        albertobrian16@gmail.com
    </div>

    <div class="splash-container">
        <svg class="logo" viewBox="0 0 256 256" role="img" aria-label="FleetControl">
            <defs>
                <linearGradient id="fcg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#48a8ff"/>
                    <stop offset="1" stop-color="#1f5bff"/>
                </linearGradient>
            </defs>
            <rect x="6" y="6" width="244" height="244" rx="54" fill="#0a1020" stroke="#1d5fe0" stroke-width="4"/>
            <!-- F: estático -->
            <polygon points="34,78 130,78 121,102 66,102 66,120 112,120 104,144 66,144 66,192 34,192" fill="url(#fcg)"/>
            <!-- C: arco a girar -->
            <g class="c-spin">
                <circle cx="150" cy="128" r="46" fill="none" stroke="url(#fcg)" stroke-width="20" stroke-dasharray="215 74" transform="rotate(-20 150 128)"/>
            </g>
            <!-- pin dentro do C -->
            <g class="pin">
                <path d="M150 156c-15-17-20-25-20-33a20 20 0 0 1 40 0c0 8-5 16-20 33z" fill="url(#fcg)"/>
                <circle cx="150" cy="123" r="7" fill="#0a1020"/>
            </g>
            <!-- ondas de sinal -->
            <path class="wave" d="M198 104a34 34 0 0 1 0 48" fill="none" stroke="#48a8ff" stroke-width="7" stroke-linecap="round"/>
            <path class="wave w2" d="M214 92a52 52 0 0 1 0 72" fill="none" stroke="#48a8ff" stroke-width="7" stroke-linecap="round"/>
        </svg>
        
        <div class="title">FleetControl</div>
        <div class="description">Sistema de Gestão de Frotas </div>
        <div class="version" id="app-version">A carregar...</div>
    </div>

</div>

    <script>
        // ─────────────────────────────────────────────────────────
        // Versão injectada pelo main process como query string.
        // Não usa IPC — disponível imediatamente sem timing issues.
        // ─────────────────────────────────────────────────────────
        function loadVersion() {
            const params  = new URLSearchParams(window.location.search);
            const version = params.get('version');

            if (version) {
                document.getElementById('app-version').textContent = `Versão ${version}`;
            } else {
                // Fallback: tentar IPC caso a query string não venha
                // (compatibilidade com chamadas directas sem query string)
                if (window.system && typeof window.system.getSystemVersion === 'function') {
                    window.system.getSystemVersion()
                        .then(v => {
                            document.getElementById('app-version').textContent = `Versão ${v}`;
                        })
                        .catch(() => {
                            document.getElementById('app-version').textContent = 'FleetControl SGF';
                        });
                } else {
                    document.getElementById('app-version').textContent = 'FleetControl SGF';
                }
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadVersion);
        } else {
            loadVersion();
        }
    </script>
</body>
</html>
